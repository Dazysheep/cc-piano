<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分段修改</title>
<script src="/ui/settings.js"></script>
<link rel="stylesheet" href="/ui/ui.css">
<style>
html, body { height: 100%; }
body { overflow: hidden; }
.page { height: 100%; display: grid; grid-template-columns: 210px minmax(0, 1fr) 440px; }
.col { min-height: 0; display: flex; flex-direction: column; }
.songs { border-right: 1px solid var(--sep); padding: 18px 10px; gap: 4px; overflow: auto; }
.songs h2 { margin: 0 8px 12px; font-size: calc(var(--fs) * 1.1); }
.songs h4 { margin: 18px 8px 6px; font-size: calc(var(--fs) * .8); color: var(--label-2); font-weight: 500; }
.song { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 10px; background: none;
  color: inherit; font: inherit; text-align: left; cursor: pointer; }
.song img, .song i { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; background: var(--fill); flex: none; }
.song span { display: flex; flex-direction: column; min-width: 0; }
.song small { color: var(--label-2); font-size: calc(var(--fs) * .74); }
.song:hover { background: var(--fill-2); }
.song.on { background: color-mix(in srgb, var(--accent) 20%, transparent); }
.ver { display: flex; align-items: center; justify-content: space-between; padding: 4px 10px; font: calc(var(--fs) * .78) var(--mono); }
.list { overflow: auto; padding: 18px; }
.list h3 { margin: 0 0 4px; font-size: calc(var(--fs) * 1.05); }
.list .hint { color: var(--label-2); font-size: calc(var(--fs) * .82); margin-bottom: 14px; }
.bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.bar .state { color: var(--label-2); font-size: calc(var(--fs) * .8); }
.secs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.sec { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid transparent; border-radius: 14px;
  background: var(--fill-2); color: inherit; font: inherit; text-align: left; cursor: pointer; }
.sec:hover { border-color: var(--sep); }
.sec.on { border-color: var(--accent); }
.sec .thumb { aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #111; display: grid; place-items: center; }
.sec .thumb img { width: 100%; height: 100%; object-fit: cover; }
.sec .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.sec b { font-size: calc(var(--fs) * .9); }
.sec .t { font: calc(var(--fs) * .72) var(--mono); color: var(--label-2); }
.sec small { color: var(--label-2); font-size: calc(var(--fs) * .78); display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.sec .badge { align-self: flex-start; padding: 1px 8px; border-radius: 999px; font-size: calc(var(--fs) * .7);
  background: color-mix(in srgb, var(--accent) 25%, transparent); }
.detail { border-left: 1px solid var(--sep); }
.detail .top { padding: 16px 16px 10px; display: flex; align-items: center; gap: 8px; }
.detail .top h2 { margin: 0; flex: 1; font-size: calc(var(--fs) * 1.02); }
.btn { padding: 6px 12px; border: 0; border-radius: 999px; background: var(--fill); color: var(--label); font: inherit;
  font-size: calc(var(--fs) * .8); cursor: pointer; white-space: nowrap; }
.btn:hover { background: color-mix(in srgb, var(--accent) 28%, transparent); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.claude { background: #d97757; color: #fff; }
.btn[disabled] { opacity: .45; cursor: default; }
.scroll { flex: 1; min-height: 0; overflow: auto; padding: 0 16px 10px; }
.big { border-radius: 14px; overflow: hidden; background: #000; }
.big video { width: 100%; display: block; }
.big .empty { padding: 50px 10px; }
.meta { margin: 10px 0; color: var(--label-2); font-size: calc(var(--fs) * .82); line-height: 1.6; }
details { margin-bottom: 10px; }
summary { cursor: pointer; color: var(--label-2); font-size: calc(var(--fs) * .82); }
pre { margin: 6px 0 0; padding: 10px; border-radius: 10px; background: var(--fill-2); font: calc(var(--fs) * .74)/1.5 var(--mono);
  white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow: auto; }
.chat { border-top: 1px solid var(--sep); display: flex; flex-direction: column; max-height: 52%; min-height: 240px; }
.chat .msgs { flex: 1; overflow: auto; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 92%; padding: 8px 12px; border-radius: 14px; font-size: calc(var(--fs) * .86); line-height: 1.55; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
.msg.ai { align-self: flex-start; background: var(--fill); }
.msg.claude { align-self: flex-start; background: color-mix(in srgb, #d97757 22%, transparent); }
.msg.sys { align-self: center; color: var(--label-2); font-size: calc(var(--fs) * .76); background: none; text-align: center; }
.proposal { align-self: stretch; border: 1px solid var(--accent); border-radius: 12px; padding: 8px 10px; }
.proposal .row { display: flex; gap: 8px; margin-top: 8px; }
.chat form { display: flex; flex-direction: column; gap: 8px; padding: 10px 16px 14px; }
.chat textarea { resize: none; height: 60px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--sep);
  background: var(--fill-2); color: var(--label); font: inherit; font-size: calc(var(--fs) * .88); }
.chat .acts { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.chat .acts small { flex: 1; color: var(--label-2); font-size: calc(var(--fs) * .72); }
.modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, .5); z-index: 9; }
.modal[hidden] { display: none; }
.modal > div { width: min(440px, 92vw); padding: 20px; border-radius: 18px; background: var(--bg-2); border: 1px solid var(--sep);
  display: flex; flex-direction: column; gap: 10px; }
.modal label { display: flex; flex-direction: column; gap: 4px; font-size: calc(var(--fs) * .84); color: var(--label-2); }
.modal input { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--sep); background: var(--fill-2); color: var(--label); font: inherit; }
.empty { color: var(--label-2); padding: 40px 10px; text-align: center; }
.song .kind { font-size: calc(var(--fs) * .66); color: var(--accent); }
.form { display: flex; flex-direction: column; gap: 10px; margin: 10px 0 12px; padding: 12px; border-radius: 12px; background: var(--fill-2); }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: calc(var(--fs) * .78); color: var(--label-2); }
.form input, .form select, .form textarea { padding: 7px 10px; border-radius: 10px; border: 1px solid var(--sep); background: var(--bg-2);
  color: var(--label); font: inherit; font-size: calc(var(--fs) * .86); }
.form textarea { resize: vertical; min-height: 64px; }
.form .row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.form .row small { flex: 1; color: var(--label-2); font-size: calc(var(--fs) * .72); }
</style>
</head>
<body>
<div class="page">
  <nav class="col songs" id="songs"><h2>分段修改</h2></nav>
  <section class="col list">
    <h3 id="songTitle">选一首歌</h3>
    <div class="hint">视频按时间分成几块（手绘动画是一镜一块，也就是关键节点）。点一块，在右边直接改它的设置，或者用聊天改：「发送」用你自己的大模型改参数；
      要画新画面、新动作就点「交给 Claude」。改完只重新渲染这一块（几十秒到两分钟），满意了再点「出整片」。每次修改都会先存一份历史版本，旧的不会丢。</div>
    <div class="bar"><button class="btn primary" id="buildBtn" type="button" disabled>出整片（约 35 分钟）</button>
      <span class="state" id="buildState"></span></div>
    <div class="secs" id="secs"></div>
  </section>
  <section class="col detail">
    <div class="top"><h2 id="dTitle">选一块</h2>
      <button class="btn" id="prevBtn" type="button" disabled>预览这一块</button>
      <button class="btn" id="apiBtn" type="button">API 设置</button></div>
    <div class="scroll" id="dBody"><div class="empty">中间点一块：这里放它在整片里的样子、当前设置，下面聊天改它。</div></div>
    <div class="chat">
      <div class="msgs" id="msgs"><div class="msg sys">选中一块后，在这里说想怎么改。</div></div>
      <form id="chatForm"><textarea id="chatIn" placeholder="比如：这条评论读完后，云朵里换成两个人拥抱的画面；女生改成闭眼点头" disabled></textarea>
        <div class="acts"><small id="cost">「交给 Claude」每次约 0.5~1.5 美元、几分钟</small>
          <button class="btn claude" id="claudeBtn" type="button" disabled>交给 Claude</button>
          <button class="btn primary" id="sendBtn" type="submit" disabled>发送（我的 API）</button></div></form>
    </div>
  </section>
</div>
<div class="modal" id="apiModal" hidden><div>
  <b>聊天用的大模型（OpenAI 兼容接口，和「动画库」共用）</b>
  <label>接口地址<input id="apiBase" placeholder="https://api.deepseek.com"></label>
  <label>模型<input id="apiModel" placeholder="deepseek-chat"></label>
  <label>密钥（只存在你电脑的用户环境变量 CC_PIANO_LLM_KEY 里，不会显示出来）<input id="apiKey" type="password" placeholder="不改就留空"></label>
  <div class="meta" id="apiState"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="apiCancel" type="button">取消</button>
    <button class="btn primary" id="apiSave" type="button">保存</button></div>
</div></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || "出错了");
  return j;
}
const KIND_ZH = { opening: "开头", card: "评论", moment: "小动画", solo: "只听一轨", finale: "尾声", ending: "结尾", song: "整体",
  shot: "镜头 · 关键节点", seg: "片段", opener: "开头模板" };
let SONGS = [], LLM = {}, stem = null, DATA = null, sel = null, chats = {}, previews = {};

function renderSongs() {
  const s = SONGS.find((x) => x.stem === stem);
  $("songs").innerHTML = "<h2>分段修改</h2>" + SONGS.map((x) =>
    `<button class="song${x.stem === stem ? " on" : ""}" data-s="${esc(x.stem)}" type="button">${x.cover ? `<img src="${x.cover}" alt="">` : "<i></i>"}
      <span><b>${esc(x.title)}</b><small>${esc(x.artist)}</small>${x.kind ? `<span class="kind">${esc(x.kind)}</span>` : ""}</span></button>`).join("") +
    (s && DATA && DATA.song.versions.length ? `<h4>历史版本（每次修改前自动保存）</h4>` + DATA.song.versions.slice().reverse().map((v) =>
      `<div class="ver"><span>v${v}</span><button class="btn" data-restore="${v}" type="button">回到这版</button></div>`).join("") : "");
}
function renderSecs() {
  if (!DATA) { $("secs").innerHTML = ""; return; }
  $("songTitle").textContent = `${DATA.song.title} · ${DATA.song.artist}${DATA.song.kind ? `（${DATA.song.kind}）` : ""}`;
  $("buildBtn").disabled = DATA.song.can_build === false;
  $("buildBtn").textContent = DATA.song.build_label || "出整片（约 35 分钟）";
  $("secs").innerHTML = DATA.sections.map((s, i) => {
    const r = s.range ? `${fmt(s.range[0])}–${fmt(s.range[1])}` : "全片";
    const pic = s.thumb ? `<img src="${s.thumb}" alt="" loading="lazy">` : `<small>${s.kind === "song" ? "标题 · 文案 · 字号" : "还没有整片"}</small>`;
    return `<button class="sec${sel && sel.id === s.id ? " on" : ""}" data-i="${i}" type="button"><div class="thumb">${pic}</div>
      <div class="row"><b>${esc(s.title)}</b><span class="t">${r}</span></div><span class="badge">${KIND_ZH[s.kind] || s.kind}</span>
      <small>${esc(s.sub)}</small></button>`;
  }).join("");
}
async function loadSong(s) {
  stem = s; sel = null;
  DATA = await api("/api/sections/list?song=" + encodeURIComponent(stem));
  renderSongs(); renderSecs();
  $("dTitle").textContent = "选一块";
  $("dBody").innerHTML = '<div class="empty">中间点一块。</div>';
  setChat(false);
}
function setChat(on) {
  $("chatIn").disabled = $("sendBtn").disabled = !on;
  $("claudeBtn").disabled = !on || (DATA && DATA.song.can_claude === false) || (sel && sel.kind === "song" && DATA.song.mode !== "story");
  $("prevBtn").disabled = !on || !sel || !sel.range;
}
// 有 fields 的块（手绘动画的镜头、片段、整体）：直接在表单里改，保存 = 采用（先存历史版本，再预览这一块）
function formHtml(s) {
  if (!s.fields) return "";
  const v = s.data || {};
  const input = (f) => {
    const val = v[f.key];
    if (f.type === "textarea") return `<textarea data-k="${f.key}" maxlength="${f.max || 600}">${esc(val)}</textarea>`;
    if (f.type === "select") return `<select data-k="${f.key}">${f.options.map(([k, zh]) => `<option value="${esc(k)}"${k === val ? " selected" : ""}>${esc(zh)}</option>`).join("")}</select>`;
    if (f.type === "number") return `<input data-k="${f.key}" type="number" step="${f.step || .01}" value="${esc(val)}">`;
    if (f.type === "tags") return `<input data-k="${f.key}" data-tags="1" value="${esc((val || []).join(" "))}">`;
    return `<input data-k="${f.key}" maxlength="${f.max || 60}" value="${esc(val)}">`;
  };
  return `<div class="form" id="editForm">${s.fields.map((f) => `<label>${esc(f.label)}${input(f)}</label>`).join("")}
    <div class="row"><small>保存前会自动存一份历史版本${s.range ? "，然后渲染这一块的预览" : ""}</small>
      <button class="btn primary" id="formSave" type="button">保存修改</button></div></div>`;
}
function formData() {
  const out = {};
  document.querySelectorAll("#editForm [data-k]").forEach((el) => {
    out[el.dataset.k] = el.dataset.tags ? el.value.replace(/#/g, " ").split(/\s+/).filter(Boolean)
      : el.type === "number" ? +el.value : el.value;
  });
  return out;
}
function msgsFor(id) { return (chats[stem + "|" + id] = chats[stem + "|" + id] || { html: [], history: [] }); }
function select(i) {
  sel = DATA.sections[i];
  renderSecs();
  $("dTitle").textContent = `${sel.title}${sel.range ? ` · ${fmt(sel.range[0])}–${fmt(sel.range[1])}` : ""}`;
  showDetail();
  const c = msgsFor(sel.id);
  $("msgs").innerHTML = c.html.join("") || `<div class="msg sys">正在改「${esc(sel.title)}」。说说想怎么改：改参数点「发送」，要新画面 / 新动作点「交给 Claude」。</div>`;
  $("msgs").scrollTop = 1e9;
  setChat(true);
}
function showDetail() {
  const p = previews[stem + "|" + sel.id];
  let media;
  if (p) media = `<video src="${p}" controls autoplay playsinline></video>`;
  else if (DATA.song.video_url && sel.range) media = `<video src="${DATA.song.video_url}#t=${sel.range[0].toFixed(1)},${sel.range[1].toFixed(1)}" controls playsinline preload="metadata"${sel.thumb ? ` poster="${sel.thumb}"` : ""}></video>`;
  else media = `<div class="empty">${sel.range ? "还没有整片，点「预览这一块」" : "「整体」改完后出整片看效果"}</div>`;
  $("dBody").innerHTML = `<div class="big">${media}</div>
    <div class="meta">${p ? "上面是这一块修改后的预览（720p，带音乐）。" : sel.range ? "上面是整片里的这一段（最近一次出的整片）。" : ""}
    ${esc(sel.sub)}</div>${formHtml(sel)}
    <details${sel.fields ? "" : " open"}><summary>这一块现在的设置（聊天改的就是它）</summary><pre>${esc(JSON.stringify(sel.data, null, 1))}</pre></details>`;
  const save = $("formSave");
  if (save) save.addEventListener("click", () => adopt(sel, formData(), $("editForm")));
}
function addMsg(cls, html) {
  const c = msgsFor(sel.id);
  const h = `<div class="msg ${cls}">${html}</div>`;
  c.html.push(h);
  $("msgs").insertAdjacentHTML("beforeend", h); $("msgs").scrollTop = 1e9;
  return $("msgs").lastElementChild;
}
async function poll(job, onProg) {
  for (;;) {
    await new Promise((ok) => setTimeout(ok, 2000));
    const j = await api("/api/sections/job?id=" + job);
    if (j.status === "done") return j.result;
    if (j.status === "error") throw new Error(j.error);
    if (j.status === "missing") throw new Error("任务不见了（琴房重启过？）");
    onProg(j);
  }
}
async function runPreview(job, box, label) {
  const keep = sel;
  const res = await poll(job, (j) => { box.textContent = `${label} ${j.status === "queued" ? "排队中…" : Math.round(j.progress * 100) + "%  " + (j.msg || "")}`; });
  const url = (res.preview && res.preview.video_url) || res.video_url;
  if (url) previews[stem + "|" + keep.id] = url + "&t=" + Date.now();
  return res;
}
async function refresh() {
  const id = sel && sel.id;
  DATA = await api("/api/sections/list?song=" + encodeURIComponent(stem));
  renderSongs();
  const i = DATA.sections.findIndex((s) => s.id === id);
  if (i >= 0) { sel = DATA.sections[i]; renderSecs(); showDetail(); } else renderSecs();
}

$("chatForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("chatIn").value.trim();
  if (!text || !sel) return;
  $("chatIn").value = "";
  addMsg("user", esc(text));
  const wait = addMsg("sys", "你的大模型正在想……");
  $("sendBtn").disabled = true;
  const it = sel, c = msgsFor(it.id);
  try {
    const r = await api("/api/sections/chat", { song: stem, sid: it.id, message: text, history: c.history });
    wait.remove(); c.html = c.html.filter((h) => !h.includes("正在想"));
    c.history.push({ role: "user", content: text }, { role: "assistant", content: r.reply + (r.proposal ? "\n" + JSON.stringify(r.proposal) : "") });
    addMsg("ai", esc(r.reply));
    if (r.proposal) {
      const p = document.createElement("div");
      p.className = "proposal";
      p.innerHTML = `<b>新方案</b><pre>${esc(JSON.stringify(r.proposal, null, 1))}</pre>
        <div class="row"><button class="btn primary" type="button">采用（先存历史版本，再预览这一块）</button></div>`;
      p.querySelector("button").addEventListener("click", () => adopt(it, r.proposal, p));
      $("msgs").appendChild(p); $("msgs").scrollTop = 1e9;
    }
  } catch (err) {
    wait.remove();
    addMsg("sys", esc(err.message));
    if (/API 设置/.test(err.message)) openApi();
  }
  $("sendBtn").disabled = false;
});
$("chatIn").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("chatForm").requestSubmit(); } });

async function adopt(it, data, box) {
  const b = box.querySelector("button.primary") || box.querySelector("button"), label = b.textContent;
  b.disabled = true; b.textContent = "保存中…";
  try {
    const r = await api("/api/sections/apply", { song: stem, sid: it.id, data });
    b.textContent = `已采用（改之前存为历史 v${r.history}）`;
    addMsg("sys", `已保存「${esc(it.title)}」（改之前存为历史 v${r.history}）。`);
    if (r.job) {
      const st = addMsg("sys", "正在渲染这一块…");
      await runPreview(r.job, st, "正在渲染这一块");
      st.textContent = "这一块的预览好了，在上面播放。";
    }
    await refresh();
  } catch (err) { b.disabled = false; b.textContent = label; addMsg("sys", esc(err.message)); }
}
$("claudeBtn").addEventListener("click", async () => {
  const text = $("chatIn").value.trim();
  if (!sel) return;
  if (!text) { addMsg("sys", "先在输入框里写要 Claude 改什么。"); return; }
  if (!confirm("交给 Claude：后台改这一块（可能会新画画面 / 动作，只新增、不改已有的），改完自动采用并渲染预览。\n每次大约 0.5~1.5 美元、几分钟。继续？")) return;
  $("chatIn").value = "";
  addMsg("user", esc(text) + "  <small>（交给 Claude）</small>");
  const st = addMsg("sys", "已交给 Claude…");
  $("claudeBtn").disabled = true;
  try {
    const r = await api("/api/sections/claude", { song: stem, sid: sel.id, message: text });
    const res = await runPreview(r.job, st, "Claude 正在改");
    st.textContent = `完成（花费约 $${res.cost_usd}，改之前存为历史 v${res.history}${res.changed && res.changed.length ? "，新增 / 改了：" + res.changed.join("、") : ""}）`;
    addMsg("claude", esc(res.summary));
    await refresh();
  } catch (err) { addMsg("sys", esc(err.message)); }
  $("claudeBtn").disabled = false;
});
$("prevBtn").addEventListener("click", async () => {
  if (!sel || !sel.range) return;
  $("prevBtn").disabled = true;
  const st = addMsg("sys", "正在渲染这一块…");
  try {
    const r = await api("/api/sections/preview", { song: stem, sid: sel.id });
    await runPreview(r.job, st, "正在渲染这一块");
    st.textContent = "预览好了。";
    showDetail();
  } catch (err) { st.textContent = err.message; }
  $("prevBtn").disabled = false;
});
$("buildBtn").addEventListener("click", async () => {
  if (!stem || !confirm(`用现在的设置重新出整片：${DATA.song.build_label || "约 35 分钟"}，期间别的预览会排队。继续？`)) return;
  $("buildBtn").disabled = true;
  try {
    const r = await api("/api/sections/build", { song: stem });
    const res = await poll(r.job, (j) => { $("buildState").textContent = j.status === "queued" ? "排队中…" : `${Math.round(j.progress * 100)}%  ${j.msg || ""}`; });
    $("buildState").textContent = "整片好了：" + (res.folder || "");
    await refresh();
  } catch (err) { $("buildState").textContent = err.message; }
  $("buildBtn").disabled = false;
});
$("songs").addEventListener("click", async (e) => {
  const r = e.target.closest("[data-restore]");
  if (r) {
    if (!confirm(`回到 v${r.dataset.restore}？现在的设置也会先存一份，随时能再回来。`)) return;
    try { const j = await api("/api/sections/restore", { song: stem, version: +r.dataset.restore }); await refresh(); alert(`已回到 v${r.dataset.restore}（刚才的设置存为 v${j.saved}）`); }
    catch (err) { alert(err.message); }
    return;
  }
  const b = e.target.closest(".song");
  if (b) loadSong(b.dataset.s).catch((err) => { $("secs").innerHTML = `<div class="empty">${esc(err.message)}</div>`; });
});
$("secs").addEventListener("click", (e) => { const b = e.target.closest(".sec"); if (b) select(+b.dataset.i); });

function openApi() {
  $("apiBase").value = LLM.base_url || ""; $("apiModel").value = LLM.model || ""; $("apiKey").value = "";
  $("apiState").textContent = LLM.has_key ? "已经配置过密钥（不显示）。" : "还没有配置密钥。";
  $("apiModal").hidden = false;
}
$("apiBtn").addEventListener("click", openApi);
$("apiCancel").addEventListener("click", () => { $("apiModal").hidden = true; });
$("apiSave").addEventListener("click", async () => {
  try {
    LLM = await api("/api/anim/llm", { base_url: $("apiBase").value.trim(), model: $("apiModel").value.trim(), key: $("apiKey").value.trim() });
    $("apiModal").hidden = true;
  } catch (e) { $("apiState").textContent = e.message; }
});
// 外壳切走时停掉视频的声音
window.addEventListener("message", (e) => {
  if (e.origin === location.origin && e.data && e.data.hidden) document.querySelectorAll("video").forEach((v) => v.pause());
});
api("/api/sections/songs").then((j) => {
  SONGS = j.songs; LLM = j.llm || {};
  renderSongs();
  const qs = new URLSearchParams(location.search), want = qs.get("song"), wantSel = qs.get("sel");   // 链接直接打开某首歌的某一块
  if (SONGS.length) loadSong(want && SONGS.some((s) => s.stem === want) ? want : SONGS[0].stem).then(() => {
    const i = wantSel ? DATA.sections.findIndex((s) => s.id === wantSel) : -1;
    if (i >= 0) select(i);
  });
  else $("secs").innerHTML = '<div class="empty">还没有能分段修改的视频（出过整片的音轨视频、手绘动画等都会出现在这里）。</div>';
}).catch((e) => { $("secs").innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
</script>
</body>
</html>
